<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de folios</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f1115;
      color: #e5e7eb;
      color-scheme: dark;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    main {
      background: #1a1d23;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .4);
      width: 100%;
      max-width: 340px;
      box-sizing: border-box;
    }
    h1 { font-size: 1.25rem; margin: 0 0 20px; }
    label { display: block; font-size: .9rem; margin-bottom: 6px; }
    .campo { position: relative; margin-bottom: 16px; }
    input, textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px 46px 10px 12px;
      font-size: 1.1rem;
      color: inherit;
      background: #0f1115;
      border: 1px solid #374151;
      border-radius: 8px;
    }
    :is(input, textarea):focus { outline: 2px solid #60a5fa; border-color: transparent; }
    ::placeholder { color: #6b7280; }
    textarea { padding-right: 12px; font: inherit; font-size: .9rem; white-space: pre; resize: vertical; }
    button {
      font: inherit;
      color: #9ca3af;
      background: none;
      border: 1px solid transparent;
      border-radius: 7px;
      cursor: pointer;
      touch-action: manipulation;
      transition: color .15s, background .15s, filter .15s, opacity .15s, visibility .15s, transform .15s;
    }
    button:hover:not(:disabled) { filter: brightness(1.25); }
    button:active:not(:disabled) { transform: scale(.94); }
    button:focus-visible { outline: 2px solid #60a5fa; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .borrar {
      position: absolute;
      inset: 1px 1px 1px auto;
      width: 44px;
      display: grid;
      place-items: center;
    }
    input:placeholder-shown + .borrar { opacity: 0; visibility: hidden; }
    .bloque {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 44px;
      margin-top: 12px;
    }
    .peligro, .borrar, .quitar { color: #fca5a5; }
    .accion { color: #93c5fd; }
    .bloque.peligro { background: #2a1517; border-color: #7f1d1d; }
    .bloque.accion { background: #172033; border-color: #1e3a8a; }

    .modos {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      padding: 4px;
      background: #0f1115;
      border-radius: 10px;
    }
    .modos button { flex: auto; min-height: 36px; white-space: nowrap; }
    .modos [aria-pressed="true"] { color: #60a5fa; background: #172033; }

    #lista { counter-reset: seccion; }
    .seccion { counter-increment: seccion; margin-bottom: 14px; }
    .cabecera {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      font-size: .9rem;
    }
    .cabecera span::before { content: 'Sección ' counter(seccion); }
    output { margin-left: auto; color: #60a5fa; font-weight: 600; }
    .seccion.error output { color: #fca5a5; font-weight: 400; }
    .quitar { width: 36px; height: 36px; display: grid; place-items: center; }
    .seccion:only-child .quitar { visibility: hidden; }
    .par { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .par input { padding-right: 12px; }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      font-size: .9rem;
      font-variant-numeric: tabular-nums;
    }
    th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid #262b34; }
    th:first-child, td:first-child { text-align: left; }
    th { color: #9ca3af; font-weight: 500; }
    tfoot td { border: 0; font-size: 1.1rem; font-weight: 700; color: #60a5fa; }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
    #resultado {
      margin: 8px 0 0;
      padding: 16px;
      background: #172033;
      border-radius: 8px;
      text-align: center;
      font-size: .9rem;
    }
    #resultado strong { display: block; font-size: 2rem; color: #60a5fa; }
    #resultado.error { background: #2a1517; color: #fca5a5; }
    #aviso { margin: 0; font-size: .9rem; color: #fca5a5; white-space: pre-line; }
  </style>
</head>
<body>
  <main>
    <h1>Calculadora de folios</h1>

    <nav class="modos">
      <button type="button" data-modo="simple" aria-pressed="true">Simple</button>
      <button type="button" data-modo="secciones" aria-pressed="false">Por secciones</button>
      <button type="button" data-modo="acuse" aria-pressed="false">Acuse</button>
    </nav>

    <section class="modo" id="simple">
    <label for="inicial">Folio inicial</label>
    <div class="campo">
      <input type="text" id="inicial" inputmode="numeric" pattern="[0-9]*" placeholder="Ej. 1001" autofocus>
      <button type="button" class="borrar" id="borrarInicial" aria-label="Borrar folio inicial" title="Borrar (Esc)" tabindex="-1">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <label for="final">Folio final</label>
    <div class="campo">
      <input type="text" id="final" inputmode="numeric" pattern="[0-9]*" placeholder="Ej. 1050">
      <button type="button" class="borrar" id="borrarFinal" aria-label="Borrar folio final" title="Borrar (Esc)" tabindex="-1">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <p id="resultado" aria-live="polite">Escribe ambos folios</p>

    <button type="button" class="bloque peligro" id="borrarTodo" disabled>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>
      Borrar todo
    </button>
    </section>

    <section class="modo" id="secciones" hidden>
      <div id="lista"></div>

      <button type="button" class="bloque accion" id="agregar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Agregar sección
      </button>

      <table id="resumen">
        <thead>
          <tr><th>Sección</th><th>Inicial</th><th>Final</th><th>Folios</th></tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr><td>Total</td><td></td><td></td><td id="total">0</td></tr>
        </tfoot>
      </table>

      <button type="button" class="bloque accion" id="copiar" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        <span>Copiar para Excel</span>
      </button>

      <button type="button" class="bloque peligro" id="reiniciar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>
        Borrar todo
      </button>
    </section>

    <section class="modo" id="acuse" hidden>
      <div class="modos" id="tipo">
        <button type="button" aria-pressed="true">Montaje</button>
        <button type="button" aria-pressed="false">Desmontaje</button>
      </div>

      <label for="pegado">Categorías y folios (una por línea)</label>
      <div class="campo">
        <textarea id="pegado" rows="8" placeholder="Kohlmann 13846 14405&#10;CaterInc 14406 14430"></textarea>
      </div>

      <label for="solicitante">Solicitante</label>
      <div class="campo"><input type="text" id="solicitante" value="Andrea Barragán"></div>

      <label for="area">Área</label>
      <div class="campo"><input type="text" id="area" value="Equipo Experiencia Culinaria"></div>

      <label for="observaciones">Observaciones</label>
      <div class="campo"><input type="text" id="observaciones"></div>

      <p id="aviso" aria-live="polite"></p>

      <table id="vista">
        <thead>
          <tr><th>Categoría</th><th>Inicial</th><th>Final</th><th>Total</th></tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr><td>Total</td><td></td><td></td><td id="totalAcuse">0</td></tr>
        </tfoot>
      </table>

      <button type="button" class="bloque accion" id="descargar" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
        Descargar Excel
      </button>
    </section>

    <template id="plantillaSeccion">
      <div class="seccion">
        <div class="cabecera">
          <span></span>
          <output></output>
          <button type="button" class="quitar" aria-label="Quitar sección" title="Quitar sección">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="par">
          <input type="text" autocapitalize="characters" placeholder="Inicial" aria-label="Folio inicial">
          <input type="text" autocapitalize="characters" placeholder="Final" aria-label="Folio final">
        </div>
      </div>
    </template>
  </main>

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
  <script src="logo.js"></script>
  <script>
    const inicial = document.getElementById('inicial');
    const final = document.getElementById('final');
    const resultado = document.getElementById('resultado');
    const borrarTodo = document.getElementById('borrarTodo');

    function aceptarSoloNumeros(event) {
      event.target.value = event.target.value.replace(/\D/g, '');
      calcular();
    }

    function borrar(...inputs) {
      inputs.forEach(input => input.value = '');
      inputs[0].focus();
      calcular();
    }

    function borrarConEscape(event) {
      if (event.key === 'Escape') borrar(event.target);
    }

    function calcular() {
      resultado.className = '';
      borrarTodo.disabled = inicial.value === '' && final.value === '';

      if (inicial.value === '' || final.value === '') {
        resultado.textContent = 'Escribe ambos folios';
        return;
      }

      const a = Number(inicial.value);
      const b = Number(final.value);

      if (b < a) {
        resultado.className = 'error';
        resultado.textContent = 'El folio final debe ser mayor o igual al inicial';
        return;
      }

      const total = b - a + 1;
      resultado.innerHTML = `<strong>${total.toLocaleString('es-MX')}</strong> folios en total`;
    }

    inicial.addEventListener('input', aceptarSoloNumeros);
    final.addEventListener('input', aceptarSoloNumeros);
    inicial.addEventListener('keydown', borrarConEscape);
    final.addEventListener('keydown', borrarConEscape);
    document.getElementById('borrarInicial').addEventListener('click', () => borrar(inicial));
    document.getElementById('borrarFinal').addEventListener('click', () => borrar(final));
    borrarTodo.addEventListener('click', () => borrar(inicial, final));
    calcular();

    const modos = document.querySelectorAll('nav button');
    const lista = document.getElementById('lista');
    const resumen = document.getElementById('resumen');
    const copiar = document.getElementById('copiar');

    function cambiarModo(event) {
      const modo = event.currentTarget.dataset.modo;
      modos.forEach(boton => boton.setAttribute('aria-pressed', boton === event.currentTarget));
      document.querySelectorAll('.modo').forEach(seccion => seccion.hidden = seccion.id !== modo);
      document.querySelector(`#${modo} :is(input, textarea)`).focus();
    }

    function agregarSeccion() {
      lista.append(document.getElementById('plantillaSeccion').content.cloneNode(true));
      lista.lastElementChild.querySelector('input').focus();
      resumir();
    }

    function reiniciarSecciones() {
      lista.replaceChildren();
      agregarSeccion();
    }

    function resumir() {
      let total = 0;
      let filas = '';

      [...lista.children].forEach((seccion, i) => {
        const [inicio, fin] = [...seccion.querySelectorAll('input')].map(input => input.value);
        const [a, b] = [inicio, fin].map(folio => folio.replace(/\D/g, ''));
        const salida = seccion.querySelector('output');
        const [letrasInicio, letrasFin] = [inicio, fin].map(folio => folio.replace(/[^A-Z]/g, ''));
        const completa = a !== '' && b !== '';
        let error = '';
        if (completa && Number(b) < Number(a)) error = 'Final menor al inicial';
        if (completa && letrasInicio !== letrasFin) error = 'Las letras no coinciden';

        seccion.classList.toggle('error', error !== '');
        salida.textContent = error;
        if (!completa || error) return;

        const folios = Number(b) - Number(a) + 1;
        total += folios;
        salida.textContent = `${folios.toLocaleString('es-MX')} folios`;
        filas += `<tr><td>${i + 1}</td><td>${inicio}</td><td>${fin}</td><td>${folios}</td></tr>`;
      });

      resumen.tBodies[0].innerHTML = filas;
      document.getElementById('total').textContent = total;
      copiar.disabled = filas === '';
    }

    function editarSeccion(event) {
      event.target.value = event.target.value.replace(/[^a-z0-9-]/gi, '').toUpperCase();
      resumir();
    }

    function navegarConTeclado(event) {
      if (!event.target.matches('input')) return;

      if (event.key === 'Escape') {
        event.target.value = '';
        resumir();
      }
      if (event.key === 'Enter') {
        const inputs = [...lista.querySelectorAll('input')];
        const siguiente = inputs[inputs.indexOf(event.target) + 1];
        siguiente ? siguiente.focus() : agregarSeccion();
      }
    }

    function quitarSeccion(event) {
      const quitar = event.target.closest('.quitar');
      if (!quitar) return;
      quitar.closest('.seccion').remove();
      resumir();
    }

    async function copiarResumen() {
      const tabla = [...resumen.rows].map(fila => [...fila.cells].map(celda => celda.textContent).join('\t')).join('\n');
      await navigator.clipboard.writeText(tabla);
      copiar.querySelector('span').textContent = 'Copiado';
      setTimeout(() => copiar.querySelector('span').textContent = 'Copiar para Excel', 1500);
    }

    modos.forEach(boton => boton.addEventListener('click', cambiarModo));
    lista.addEventListener('input', editarSeccion);
    lista.addEventListener('keydown', navegarConTeclado);
    lista.addEventListener('click', quitarSeccion);
    document.getElementById('agregar').addEventListener('click', agregarSeccion);
    document.getElementById('reiniciar').addEventListener('click', reiniciarSecciones);
    copiar.addEventListener('click', copiarResumen);
    agregarSeccion();

    const tipo = document.getElementById('tipo');
    const pegado = document.getElementById('pegado');
    const solicitante = document.getElementById('solicitante');
    const area = document.getElementById('area');
    const descargar = document.getElementById('descargar');
    const FILA_PEGADA = /^(?:(?:des)?montaje\s*-\s*)?(.+?)[\s:,;|-]+(\d+)\D+(\d+)$/i;
    const pegadoPorTipo = { MONTAJE: '', DESMONTAJE: '' };
    let filasAcuse = [];

    function tipoElegido() {
      return tipo.querySelector('[aria-pressed="true"]').textContent.toUpperCase();
    }

    function elegirTipo(event) {
      tipo.querySelectorAll('button').forEach(boton => boton.setAttribute('aria-pressed', boton === event.currentTarget));
      pegado.value = pegadoPorTipo[tipoElegido()];
      pegado.focus();
      leerPegado();
    }

    function leerPegado() {
      const ilegibles = [];
      filasAcuse = [];
      pegadoPorTipo[tipoElegido()] = pegado.value;

      for (const [seccion, texto] of Object.entries(pegadoPorTipo)) {
        for (const linea of texto.split('\n').map(linea => linea.trim()).filter(Boolean)) {
          const columnas = linea.split('\t');
          const sinColumnasExtra = columnas.length > 3 ? `${columnas[0]}\t${columnas.at(-2)}\t${columnas.at(-1)}` : linea;
          const [, nombre, a, b] = sinColumnasExtra.match(FILA_PEGADA) ?? [];
          if (Number(b) >= Number(a)) filasAcuse.push({ categoria: `${seccion} - ${nombre}`, inicial: Number(a), final: Number(b), total: b - a + 1 });
          else ilegibles.push(`${seccion}: ${linea}`);
        }
      }

      const problema = ilegibles.length ? `No pude leer:\n${ilegibles.join('\n')}` : '';

      document.getElementById('vista').tBodies[0].replaceChildren(...filasAcuse.map(fila => {
        const renglon = document.createElement('tr');
        Object.values(fila).forEach(valor => renglon.insertCell().textContent = valor);
        return renglon;
      }));
      document.getElementById('totalAcuse').textContent = filasAcuse.reduce((suma, fila) => suma + fila.total, 0);
      document.getElementById('aviso').textContent = problema;
      descargar.disabled = filasAcuse.length === 0 || problema !== '';
    }

    async function descargarAcuse() {
      const libro = new ExcelJS.Workbook();
      const hoja = libro.addWorksheet('ACUSE', { pageSetup: { fitToPage: true, fitToHeight: 0 } });
      const negrita = { bold: true };
      const centrado = { horizontal: 'center', vertical: 'middle' };
      const fino = { style: 'thin' };
      const grueso = { style: 'medium' };
      const escribir = (celda, valor, estilo) => Object.assign(hoja.getCell(celda), { value: valor, ...estilo });

      hoja.columns = [{ width: 54 }, { width: 19 }, { width: 15.5 }, { width: 12 }];
      [22, 34, 24].forEach((alto, i) => hoja.getRow(5 + i).height = alto);
      hoja.addImage(libro.addImage({ base64: LOGO, extension: 'jpeg' }), { tl: { col: 0, row: 3 }, ext: { width: 270, height: 127 } });

      hoja.mergeCells('B5:D5');
      hoja.mergeCells('B6:D6');
      escribir('B5', 'ACUSE DE RECIBIDO', { font: { bold: true, size: 16 }, alignment: centrado });
      escribir('B6', 'F1- 2026', { font: { bold: true, size: 16 }, alignment: centrado });

      escribir('A8', 'SOLICITANTE:', { font: negrita });
      escribir('B8', solicitante.value, { font: negrita });
      escribir('A9', 'ÁREA:', { font: negrita });
      escribir('B9', area.value, { font: negrita });
      escribir('A10', 'OBSERVACIONES:', { font: negrita });
      escribir('B10', document.getElementById('observaciones').value, { font: negrita });

      ['CATEGORIA', 'FOLIO INICIAL', 'FOLIO FINAL', 'TOTAL'].forEach((titulo, i) => escribir(`${'ABCD'[i]}12`, titulo, {
        font: negrita,
        alignment: centrado,
        fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF9BC2E6' } },
        border: { top: grueso, bottom: grueso, left: grueso, right: grueso },
      }));

      filasAcuse.forEach(({ categoria, inicial, final, total }, i) => {
        const n = 13 + i;
        const renglon = hoja.getRow(n);
        renglon.height = 26;
        renglon.values = [categoria, inicial, final, { formula: `C${n}-B${n}+1`, result: total }];
        renglon.eachCell((celda, columna) => {
          celda.alignment = { horizontal: 'left', vertical: 'middle' };
          celda.border = {
            top: fino,
            bottom: i === filasAcuse.length - 1 ? grueso : fino,
            left: columna === 1 ? grueso : fino,
            right: columna === 4 ? grueso : fino,
          };
        });
      });

      const firma = 13 + filasAcuse.length + 4;
      escribir(`A${firma}`, `RECIBE:${'_'.repeat(33)}   FIRMA:${'_'.repeat(27)}`);
      escribir(`A${firma + 2}`, `FECHA:${'_'.repeat(34)}`);

      const enlace = document.createElement('a');
      enlace.href = URL.createObjectURL(new Blob([await libro.xlsx.writeBuffer()]));
      enlace.download = `ACUSE F1-26 ${solicitante.value}.xlsx`;
      enlace.click();
    }

    for (const campo of [solicitante, area]) {
      campo.value = localStorage[campo.id] ?? campo.value;
      campo.addEventListener('input', () => localStorage[campo.id] = campo.value);
    }
    tipo.querySelectorAll('button').forEach(boton => boton.addEventListener('click', elegirTipo));
    pegado.addEventListener('input', leerPegado);
    descargar.addEventListener('click', descargarAcuse);
    leerPegado();
  </script>
</body>
</html>
