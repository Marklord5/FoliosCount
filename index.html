<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de folios</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f1115;
      color: #e5e7eb;
      color-scheme: dark;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    main {
      background: #1a1d23;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .4);
      width: 100%;
      max-width: 340px;
      box-sizing: border-box;
    }
    h1 { font-size: 1.25rem; margin: 0 0 20px; }
    label { display: block; font-size: .9rem; margin-bottom: 16px; }
    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 10px 12px;
      font-size: 1.1rem;
      color: inherit;
      background: #0f1115;
      border: 1px solid #374151;
      border-radius: 8px;
    }
    input:focus { outline: 2px solid #60a5fa; border-color: transparent; }
    #resultado {
      margin: 8px 0 0;
      padding: 16px;
      background: #172033;
      border-radius: 8px;
      text-align: center;
      font-size: .9rem;
    }
    #resultado strong { display: block; font-size: 2rem; color: #60a5fa; }
    #resultado.error { background: #2a1517; color: #fca5a5; }
  </style>
</head>
<body>
  <main>
    <h1>Calculadora de folios</h1>

    <label>
      Folio inicial
      <input type="number" id="inicial" min="0" step="1" autofocus>
    </label>

    <label>
      Folio final
      <input type="number" id="final" min="0" step="1">
    </label>

    <p id="resultado">Escribe ambos folios</p>
  </main>

  <script>
    const inicial = document.getElementById('inicial');
    const final = document.getElementById('final');
    const resultado = document.getElementById('resultado');

    function calcular() {
      resultado.className = '';

      if (inicial.value === '' || final.value === '') {
        resultado.textContent = 'Escribe ambos folios';
        return;
      }

      const a = Number(inicial.value);
      const b = Number(final.value);

      if (b < a) {
        resultado.className = 'error';
        resultado.textContent = 'El folio final debe ser mayor o igual al inicial';
        return;
      }

      const total = b - a;
      resultado.innerHTML = `<strong>${total.toLocaleString('es-MX')}</strong> folios en total`;
    }

    inicial.addEventListener('input', calcular);
    final.addEventListener('input', calcular);
  </script>
</body>
</html>
