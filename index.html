<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de folios</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f1115;
      color: #e5e7eb;
      color-scheme: dark;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    main {
      background: #1a1d23;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .4);
      width: 100%;
      max-width: 340px;
      box-sizing: border-box;
    }
    [hidden] { display: none !important; }
    h1 { font-size: 1.25rem; margin: 0 0 20px; }
    label { display: block; font-size: .9rem; margin-bottom: 6px; }
    .campo { position: relative; margin-bottom: 16px; }
    input, textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px 46px 10px 12px;
      font-size: 1.1rem;
      color: inherit;
      background: #0f1115;
      border: 1px solid #374151;
      border-radius: 8px;
    }
    :is(input, textarea):focus { outline: 2px solid #60a5fa; border-color: transparent; }
    ::placeholder { color: #6b7280; }
    input[type="color"] { height: 44px; padding: 4px; cursor: pointer; }
    textarea { padding-right: 12px; font: inherit; font-size: .9rem; white-space: pre; resize: vertical; }
    button {
      font: inherit;
      color: #9ca3af;
      background: none;
      border: 1px solid transparent;
      border-radius: 7px;
      cursor: pointer;
      touch-action: manipulation;
      transition: color .15s, background .15s, filter .15s, opacity .15s, visibility .15s, transform .15s;
    }
    button:hover:not(:disabled) { filter: brightness(1.25); }
    button:active:not(:disabled) { transform: scale(.94); }
    button:focus-visible { outline: 2px solid #60a5fa; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .borrar {
      position: absolute;
      inset: 1px 1px 1px auto;
      width: 44px;
      display: grid;
      place-items: center;
    }
    input:placeholder-shown + .borrar { opacity: 0; visibility: hidden; }
    .bloque {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 44px;
      margin-top: 12px;
    }
    .peligro, .borrar, .quitar { color: #fca5a5; }
    .accion { color: #93c5fd; }
    .bloque.peligro { background: #2a1517; border-color: #7f1d1d; }
    .bloque.accion { background: #172033; border-color: #1e3a8a; }

    .modos {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      padding: 4px;
      background: #0f1115;
      border-radius: 10px;
    }
    .modos button { flex: auto; min-height: 36px; padding-inline: 2px; font-size: .9rem; white-space: nowrap; }
    .modos [aria-pressed="true"] { color: #60a5fa; background: #172033; }
    nav.modos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    nav.modos button {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 4px;
      min-height: 56px;
      padding: 6px 2px;
      font-size: .8rem;
      line-height: 1.2;
      white-space: normal;
    }
    nav.modos button:hover:not([aria-pressed="true"]) { color: #e5e7eb; background: #1a1d23; }
    nav.modos [aria-pressed="true"] { border-color: #1e3a8a; }

    #lista { counter-reset: seccion; }
    .seccion { counter-increment: seccion; margin-bottom: 14px; }
    .cabecera {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      font-size: .9rem;
    }
    .cabecera span::before { content: 'Sección ' counter(seccion); }
    output { margin-left: auto; color: #60a5fa; font-weight: 600; }
    .seccion.error output { color: #fca5a5; font-weight: 400; }
    .quitar { width: 36px; height: 36px; display: grid; place-items: center; }
    .seccion:only-child .quitar { visibility: hidden; }
    .par { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .par input { padding-right: 12px; }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      font-size: .9rem;
      font-variant-numeric: tabular-nums;
    }
    th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid #262b34; }
    th:first-child, td:first-child { text-align: left; }
    th { color: #9ca3af; font-weight: 500; }
    tfoot td { border: 0; font-size: 1.1rem; font-weight: 700; color: #60a5fa; }

    .formatos { display: grid; gap: 8px; margin: 0 0 16px; padding: 0; border: 0; }
    .formatos legend { margin-bottom: 6px; padding: 0; font-size: .9rem; }
    .formato {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 44px;
      margin: 0;
      padding: 12px;
      font-size: .8rem;
      line-height: 1.4;
      color: #9ca3af;
      background: #0f1115;
      border: 1px solid #374151;
      border-radius: 8px;
      cursor: pointer;
      transition: color .15s, background .15s, border-color .15s;
    }
    .formato:hover { border-color: #6b7280; }
    .formato:has(:checked) { color: #cbd5e1; background: #172033; border-color: #60a5fa; }
    .formato:has(:focus-visible) { outline: 2px solid #60a5fa; outline-offset: 2px; }
    .formato input { position: absolute; width: auto; opacity: 0; pointer-events: none; }
    .formato svg { flex: none; }
    .formato span { flex: 1; }
    .formato strong { display: block; font-size: .95rem; color: #e5e7eb; }
    .formato small {
      margin-left: 6px;
      padding: 2px 8px;
      font-size: .75rem;
      font-weight: 500;
      color: #93c5fd;
      background: #1e3a8a;
      border-radius: 999px;
      vertical-align: 1px;
    }
    .formato .elegido path { opacity: 0; transition: opacity .15s; }
    .formato :checked ~ .elegido { color: #60a5fa; }
    .formato :checked ~ .elegido path { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      button, .formato, .formato .elegido path { transition: none; }
    }
    #resultado {
      margin: 8px 0 0;
      padding: 16px;
      background: #172033;
      border-radius: 8px;
      text-align: center;
      font-size: .9rem;
    }
    #resultado strong { display: block; font-size: 2rem; color: #60a5fa; }
    #resultado.error { background: #2a1517; color: #fca5a5; }
    #aviso, #avisoQr { margin: 0; font-size: .9rem; color: #fca5a5; white-space: pre-line; }

    #nombreIne { padding-right: 12px; font-size: 1rem; text-transform: uppercase; }
    .lado { margin-bottom: 16px; }
    .carga { position: relative; margin: 0; cursor: pointer; }
    .carga input { position: absolute; width: 1px; height: 1px; padding: 0; opacity: 0; }
    .tarjeta {
      display: grid;
      place-items: center;
      aspect-ratio: 1284 / 810;
      margin-top: 6px;
      overflow: hidden;
      color: #6b7280;
      background: #0f1115;
      border: 1px dashed #374151;
      border-radius: 8px;
      transition: border-color .15s;
    }
    .tarjeta > * { grid-area: 1 / 1; }
    .carga:hover :is(.tarjeta, .archivo) { border-color: #6b7280; }
    .carga:has(:focus-visible) :is(.tarjeta, .archivo) { outline: 2px solid #60a5fa; outline-offset: 2px; }
    .tarjeta:has(.recorte:not([hidden])) { border-style: solid; }
    .recorte { width: 100%; height: 100%; object-fit: cover; transition: opacity .15s; }
    .vacio, .procesando { display: grid; justify-items: center; gap: 6px; font-size: .85rem; }
    .procesando { display: none; color: #93c5fd; }
    .cargando .vacio, .recorte:not([hidden]) ~ .vacio { display: none; }
    .cargando .procesando { display: grid; }
    .cargando .recorte { opacity: .3; }
    .cargando .tarjeta { border-color: #1e3a8a; }
    .giro { width: 24px; height: 24px; border: 3px solid #1e3a8a; border-top-color: #60a5fa; border-radius: 50%; animation: giro .8s linear infinite; }
    @keyframes giro { to { rotate: 1turn; } }
    @media (prefers-reduced-motion: reduce) { .giro { animation-duration: 3s; } }
    .ajustar { margin-top: 8px; border-color: #374151; }
    #avisoIne, #avisoUnir { margin: 0; font-size: .9rem; color: #9ca3af; white-space: pre-line; }
    :is(#avisoIne, #avisoUnir).error { color: #fca5a5; }
    .titulo { margin: 0 0 6px; font-size: .9rem; }
    #tipoAnexo { margin-bottom: 8px; }
    #cargaAnexo { margin-bottom: 16px; }
    .archivo {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      box-sizing: border-box;
      padding: 10px 12px;
      font-size: .85rem;
      color: #9ca3af;
      background: #0f1115;
      border: 1px dashed #374151;
      border-radius: 8px;
      transition: border-color .15s;
    }
    .archivo svg { flex: none; }
    .archivo span { flex: 1; overflow-wrap: anywhere; }
    .archivo.listo { color: #e5e7eb; background: #172033; border: 1px solid #1e3a8a; }
    #unir .archivo { margin-top: 6px; }
    #listaUnir { margin: 8px 0 12px; padding: 0; list-style: none; counter-reset: pdf; }
    #listaUnir li {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0 4px 4px;
      font-size: .85rem;
      border-bottom: 1px solid #262b34;
      counter-increment: pdf;
    }
    #listaUnir li::before { content: counter(pdf); min-width: 1.4em; color: #60a5fa; font-variant-numeric: tabular-nums; }
    #listaUnir span { flex: 1; overflow-wrap: anywhere; }
    .subir { width: 36px; height: 36px; display: grid; place-items: center; }
    #listaUnir li:first-child .subir { visibility: hidden; }
    #editor {
      width: min(720px, 100% - 32px);
      box-sizing: border-box;
      padding: 16px;
      color: inherit;
      background: #1a1d23;
      border: 0;
      border-radius: 12px;
    }
    #editor::backdrop { background: rgba(0, 0, 0, .7); }
    #editor p { margin: 0 0 12px; font-size: .9rem; }
    .lienzo {
      position: relative;
      width: min(100%, 70vh * var(--proporcion, 1));
      margin: auto;
      touch-action: none;
      user-select: none;
      cursor: crosshair;
    }
    .lienzo img { display: block; width: 100%; border-radius: 4px; pointer-events: none; }
    .lienzo svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .lienzo polygon { fill: rgba(96, 165, 250, .15); stroke: #60a5fa; stroke-width: 2; vector-effect: non-scaling-stroke; }
    .esquina {
      position: absolute;
      width: 24px;
      height: 24px;
      translate: -50% -50%;
      background: rgba(96, 165, 250, .35);
      border: 2px solid #60a5fa;
      border-radius: 50%;
      box-sizing: border-box;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Calculadora de folios</h1>

    <nav class="modos">
      <button type="button" data-modo="simple" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 4L7 20M17 4l-2 16M4 9h16M3 15h16"/></svg>
        Simple
      </button>
      <button type="button" data-modo="secciones" aria-pressed="false" title="Por secciones">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
        Secciones
      </button>
      <button type="button" data-modo="acuse" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H6a1 1 0 0 0-1 1v15a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-3M9 3h6v3H9zM9 14l2 2 4-4"/></svg>
        Acuse
      </button>
      <button type="button" data-modo="qr" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h3M21 18v3"/></svg>
        QR
      </button>
      <button type="button" data-modo="ine" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="11" r="2"/><path d="M5 16c.5-1.3 1.6-2 3-2s2.5.7 3 2M14 10h5M14 14h4"/></svg>
        INE
      </button>
      <button type="button" data-modo="unir" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H9a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7zM15 2v5h5M3 7v13a2 2 0 0 0 2 2h9"/></svg>
        Unir PDF
      </button>
    </nav>

    <section class="modo" id="simple">
    <label for="inicial">Folio inicial</label>
    <div class="campo">
      <input type="text" id="inicial" inputmode="numeric" pattern="[0-9]*" placeholder="Ej. 1001" autofocus>
      <button type="button" class="borrar" id="borrarInicial" aria-label="Borrar folio inicial" title="Borrar (Esc)" tabindex="-1">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <label for="final">Folio final</label>
    <div class="campo">
      <input type="text" id="final" inputmode="numeric" pattern="[0-9]*" placeholder="Ej. 1050">
      <button type="button" class="borrar" id="borrarFinal" aria-label="Borrar folio final" title="Borrar (Esc)" tabindex="-1">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <p id="resultado" aria-live="polite">Escribe ambos folios</p>

    <button type="button" class="bloque accion" id="copiarFolios" disabled>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
      <span>Copiar folios</span>
    </button>

    <button type="button" class="bloque peligro" id="borrarTodo" disabled>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>
      Borrar todo
    </button>
    </section>

    <section class="modo" id="secciones" hidden>
      <div id="lista"></div>

      <button type="button" class="bloque accion" id="agregar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Agregar sección
      </button>

      <table id="resumen">
        <thead>
          <tr><th>Sección</th><th>Inicial</th><th>Final</th><th>Folios</th></tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr><td>Total</td><td></td><td></td><td id="total">0</td></tr>
        </tfoot>
      </table>

      <button type="button" class="bloque accion" id="copiar" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        <span>Copiar para Excel</span>
      </button>

      <button type="button" class="bloque peligro" id="reiniciar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>
        Borrar todo
      </button>
    </section>

    <section class="modo" id="acuse" hidden>
      <div class="modos" id="tipo">
        <button type="button" aria-pressed="true">Montaje</button>
        <button type="button" aria-pressed="false">Desmontaje</button>
      </div>

      <label for="pegado">Categorías y folios (una por línea)</label>
      <div class="campo">
        <textarea id="pegado" rows="8" placeholder="Kohlmann 13846 14405&#10;CaterInc 14406 14430"></textarea>
      </div>

      <label for="solicitante">Solicitante</label>
      <div class="campo"><input type="text" id="solicitante" placeholder="Ej. Andrea Barragán"></div>

      <label for="area">Área</label>
      <div class="campo"><input type="text" id="area" placeholder="Ej. Equipo Experiencia Culinaria"></div>

      <label for="observaciones">Observaciones</label>
      <div class="campo"><input type="text" id="observaciones"></div>

      <p id="aviso" aria-live="polite"></p>

      <table id="vista">
        <thead>
          <tr><th>Categoría</th><th>Inicial</th><th>Final</th><th>Total</th></tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr><td>Total</td><td></td><td></td><td id="totalAcuse">0</td></tr>
        </tfoot>
      </table>

      <button type="button" class="bloque accion" id="descargar" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
        Descargar Excel
      </button>

      <button type="button" class="bloque peligro" id="limpiarAcuse">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>
        Borrar todo
      </button>
    </section>

    <section class="modo" id="qr" hidden>
      <label for="foliosQr">Folios (uno por línea)</label>
      <div class="campo">
        <textarea id="foliosQr" rows="8" placeholder="FOLIO-1001&#10;FOLIO-1002"></textarea>
      </div>

      <label for="colorQr">Color del QR</label>
      <div class="campo"><input type="color" id="colorQr" value="#000000"></div>

      <p id="avisoQr" aria-live="polite"></p>

      <fieldset class="formatos" id="formatos">
        <legend>Formato</legend>

        <label class="formato">
          <input type="radio" name="formato" value="PDF" checked>
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"/></svg>
          <span><strong>PDF <small>Recomendado</small></strong>Para imprimir: 130 por hoja, igual en cualquier equipo.</span>
          <svg class="elegido" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
        </label>

        <label class="formato">
          <input type="radio" name="formato" value="Excel">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></svg>
          <span><strong>Excel</strong>Para editar: una tarjeta por celda, 9 por fila.</span>
          <svg class="elegido" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
        </label>
      </fieldset>

      <button type="button" class="bloque accion" id="descargarQr" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
        <span>Descargar PDF</span>
      </button>

      <button type="button" class="bloque peligro" id="limpiarQr">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>
        Borrar todo
      </button>
    </section>

    <section class="modo" id="ine" hidden>
      <div class="lado" data-lado="frente">
        <label class="carga">
          INE frontal

    <template id="plantillaSeccion">
      <div class="seccion">
        <div class="cabecera">
          <span></span>
          <output></output>
          <button type="button" class="quitar" aria-label="Quitar sección" title="Quitar sección">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="par">
          <input type="text" autocapitalize="characters" placeholder="Inicial" aria-label="Folio inicial">

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="logo.js"></script>
  <script>
    const inicial = document.getElementById('inicial');
    const final = document.getElementById('final');
    const resultado = document.getElementById('resultado');
    const borrarTodo = document.getElementById('borrarTodo');
    const copiarFolios = document.getElementById('copiarFolios');

    function aceptarSoloNumeros(event) {
      event.target.value = event.target.value.replace(/\D/g, '');
      calcular();
    }

    function borrar(...inputs) {
      inputs.forEach(input => input.value = '');
      inputs[0].focus();
      calcular();
    }

    function borrarConEscape(event) {
      if (event.key === 'Escape') borrar(event.target);
    }

    function calcular() {
      resultado.className = '';
      borrarTodo.disabled = inicial.value === '' && final.value === '';
      copiarFolios.disabled = true;

      if (inicial.value === '' || final.value === '') {
        resultado.textContent = 'Escribe ambos folios';
        return;
      }

      const a = Number(inicial.value);
      const b = Number(final.value);

      if (b < a) {
        resultado.className = 'error';
        resultado.textContent = 'El folio final debe ser mayor o igual al inicial';
        return;
      }

      const total = b - a + 1;
      resultado.innerHTML = `<strong>${total.toLocaleString('es-MX')}</strong> folios en total`;
      copiarFolios.disabled = false;
    }

    async function copiarRango() {
      await navigator.clipboard.writeText(`${inicial.value} ${final.value}`);
      copiarFolios.querySelector('span').textContent = 'Copiado';
      setTimeout(() => copiarFolios.querySelector('span').textContent = 'Copiar folios', 1500);
    }

    inicial.addEventListener('input', aceptarSoloNumeros);
    final.addEventListener('input', aceptarSoloNumeros);
    inicial.addEventListener('keydown', borrarConEscape);
    final.addEventListener('keydown', borrarConEscape);
    document.getElementById('borrarInicial').addEventListener('click', () => borrar(inicial));
    document.getElementById('borrarFinal').addEventListener('click', () => borrar(final));
    borrarTodo.addEventListener('click', () => borrar(inicial, final));
    copiarFolios.addEventListener('click', copiarRango);
    calcular();

    const modos = document.querySelectorAll('nav button');
    const lista = document.getElementById('lista');
    const resumen = document.getElementById('resumen');
    const copiar = document.getElementById('copiar');

    function cambiarModo(event) {
      const modo = event.currentTarget.dataset.modo;
      modos.forEach(boton => boton.setAttribute('aria-pressed', boton === event.currentTarget));
      document.querySelectorAll('.modo').forEach(seccion => seccion.hidden = seccion.id !== modo);
      document.querySelector(`#${modo} :is(input, textarea)`).focus();
    }

    function agregarSeccion() {
      lista.append(document.getElementById('plantillaSeccion').content.cloneNode(true));
      lista.lastElementChild.querySelector('input').focus();
      resumir();
    }

    function reiniciarSecciones() {
      lista.replaceChildren();
      agregarSeccion();
    }

    function resumir() {
      let total = 0;
      let filas = '';

      [...lista.children].forEach((seccion, i) => {
        const [inicio, fin] = [...seccion.querySelectorAll('input')].map(input => input.value);
        const [a, b] = [inicio, fin].map(folio => folio.replace(/\D/g, ''));
        const salida = seccion.querySelector('output');
        const [letrasInicio, letrasFin] = [inicio, fin].map(folio => folio.replace(/[^A-Z]/g, ''));
        const completa = a !== '' && b !== '';
        let error = '';
        if (completa && Number(b) < Number(a)) error = 'Final menor al inicial';
        if (completa && letrasInicio !== letrasFin) error = 'Las letras no coinciden';

        seccion.classList.toggle('error', error !== '');
        salida.textContent = error;
        if (!completa || error) return;

        const folios = Number(b) - Number(a) + 1;
        total += folios;
        salida.textContent = `${folios.toLocaleString('es-MX')} folios`;
        filas += `<tr><td>${i + 1}</td><td>${inicio}</td><td>${fin}</td><td>${folios}</td></tr>`;
      });

      resumen.tBodies[0].innerHTML = filas;
      document.getElementById('total').textContent = total;
      copiar.disabled = filas === '';
    }

    function editarSeccion(event) {
      event.target.value = event.target.value.replace(/[^a-z0-9-]/gi, '').toUpperCase();
      resumir();
    }

    function navegarConTeclado(event) {
      if (!event.target.matches('input')) return;

      if (event.key === 'Escape') {
        event.target.value = '';
        resumir();
      }
      if (event.key === 'Enter') {
        const inputs = [...lista.querySelectorAll('input')];
        const siguiente = inputs[inputs.indexOf(event.target) + 1];
        siguiente ? siguiente.focus() : agregarSeccion();
      }
    }

    function quitarSeccion(event) {
      const quitar = event.target.closest('.quitar');
      if (!quitar) return;
      quitar.closest('.seccion').remove();
      resumir();
    }

    async function copiarResumen() {
      const tabla = [...resumen.rows].map(fila => [...fila.cells].map(celda => celda.textContent).join('\t')).join('\n');
      await navigator.clipboard.writeText(tabla);
      copiar.querySelector('span').textContent = 'Copiado';
      setTimeout(() => copiar.querySelector('span').textContent = 'Copiar para Excel', 1500);
    }

    modos.forEach(boton => boton.addEventListener('click', cambiarModo));
    lista.addEventListener('input', editarSeccion);
    lista.addEventListener('keydown', navegarConTeclado);
    lista.addEventListener('click', quitarSeccion);
    document.getElementById('agregar').addEventListener('click', agregarSeccion);
    document.getElementById('reiniciar').addEventListener('click', reiniciarSecciones);
    copiar.addEventListener('click', copiarResumen);
    agregarSeccion();

    const tipo = document.getElementById('tipo');
    const pegado = document.getElementById('pegado');
    const solicitante = document.getElementById('solicitante');
    const area = document.getElementById('area');
    const descargar = document.getElementById('descargar');
    const FILA_PEGADA = /^(?:(?:des)?montaje\s*-\s*)?(.+?)[\s:,;|-]+(\d+)\D+(\d+)$/i;
    const pegadoPorTipo = { MONTAJE: '', DESMONTAJE: '' };
    let filasAcuse = [];

    function tipoElegido() {
      return tipo.querySelector('[aria-pressed="true"]').textContent.toUpperCase();
    }

    function elegirTipo(event) {
      tipo.querySelectorAll('button').forEach(boton => boton.setAttribute('aria-pressed', boton === event.currentTarget));
      pegado.value = pegadoPorTipo[tipoElegido()];
      pegado.focus();
      leerPegado();
    }

    function leerPegado() {
      const ilegibles = [];
      filasAcuse = [];
      pegadoPorTipo[tipoElegido()] = pegado.value;

      for (const [seccion, texto] of Object.entries(pegadoPorTipo)) {
        for (const linea of texto.split('\n').map(linea => linea.trim()).filter(Boolean)) {
          const columnas = linea.split('\t');
          const sinColumnasExtra = columnas.length > 3 ? `${columnas[0]}\t${columnas.at(-2)}\t${columnas.at(-1)}` : linea;
          const [, nombre, a, b] = sinColumnasExtra.match(FILA_PEGADA) ?? [];
          if (Number(b) >= Number(a)) filasAcuse.push({ categoria: `${seccion} - ${nombre}`, inicial: Number(a), final: Number(b), total: b - a + 1 });
          else ilegibles.push(`${seccion}: ${linea}`);
        }
      }

      const problema = ilegibles.length ? `No pude leer:\n${ilegibles.join('\n')}` : '';

      document.getElementById('vista').tBodies[0].replaceChildren(...filasAcuse.map(fila => {
        const renglon = document.createElement('tr');
        Object.values(fila).forEach(valor => renglon.insertCell().textContent = valor);
        return renglon;
      }));
      document.getElementById('totalAcuse').textContent = filasAcuse.reduce((suma, fila) => suma + fila.total, 0);
      document.getElementById('aviso').textContent = problema;
      descargar.disabled = filasAcuse.length === 0 || problema !== '';
    }

    async function descargarLibro(libro, nombre) {
      const enlace = document.createElement('a');
      enlace.href = URL.createObjectURL(new Blob([await libro.xlsx.writeBuffer()]));
      enlace.download = `${nombre}.xlsx`;
      enlace.click();
    }

    async function descargarAcuse() {
      const libro = new ExcelJS.Workbook();
      const hoja = libro.addWorksheet('ACUSE', { pageSetup: { fitToPage: true, fitToHeight: 0 } });
      const negrita = { bold: true };
      const centrado = { horizontal: 'center', vertical: 'middle' };
      const fino = { style: 'thin' };
      const grueso = { style: 'medium' };
      const escribir = (celda, valor, estilo) => Object.assign(hoja.getCell(celda), { value: valor, ...estilo });

      hoja.columns = [{ width: 54 }, { width: 19 }, { width: 15.5 }, { width: 12 }];
      [22, 34, 24].forEach((alto, i) => hoja.getRow(5 + i).height = alto);
      hoja.addImage(libro.addImage({ base64: LOGO, extension: 'jpeg' }), { tl: { col: 0, row: 3 }, ext: { width: 270, height: 127 } });

      hoja.mergeCells('B5:D5');
      hoja.mergeCells('B6:D6');
      escribir('B5', 'ACUSE DE RECIBIDO', { font: { bold: true, size: 16 }, alignment: centrado });
      escribir('B6', 'F1- 2026', { font: { bold: true, size: 16 }, alignment: centrado });

      escribir('A8', 'SOLICITANTE:', { font: negrita });
      escribir('B8', solicitante.value, { font: negrita });
      escribir('A9', 'ÁREA:', { font: negrita });
      escribir('B9', area.value, { font: negrita });
      escribir('A10', 'OBSERVACIONES:', { font: negrita });
      escribir('B10', document.getElementById('observaciones').value, { font: negrita });

      ['CATEGORIA', 'FOLIO INICIAL', 'FOLIO FINAL', 'TOTAL'].forEach((titulo, i) => escribir(`${'ABCD'[i]}12`, titulo, {
        font: negrita,
        alignment: centrado,
        fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF9BC2E6' } },
        border: { top: grueso, bottom: grueso, left: grueso, right: grueso },
      }));

      filasAcuse.forEach(({ categoria, inicial, final, total }, i) => {
        const n = 13 + i;
        const renglon = hoja.getRow(n);
        renglon.height = 26;
        renglon.values = [categoria, inicial, final, { formula: `C${n}-B${n}+1`, result: total }];
        renglon.eachCell((celda, columna) => {
          celda.alignment = { horizontal: 'left', vertical: 'middle' };
          celda.border = {
            top: fino,
            bottom: i === filasAcuse.length - 1 ? grueso : fino,
            left: columna === 1 ? grueso : fino,
            right: columna === 4 ? grueso : fino,
          };
        });
      });

      const firma = 13 + filasAcuse.length + 4;
      escribir(`A${firma}`, `RECIBE:${'_'.repeat(33)}   FIRMA:${'_'.repeat(27)}`);
      escribir(`A${firma + 2}`, `FECHA:${'_'.repeat(34)}`);

      await descargarLibro(libro, `ACUSE F1-26 ${solicitante.value}`.trim());
    }

    function limpiarAcuse() {
      Object.keys(pegadoPorTipo).forEach(seccion => pegadoPorTipo[seccion] = '');
      document.querySelectorAll('#acuse :is(input, textarea)').forEach(campo => campo.value = '');
      pegado.focus();
      leerPegado();
    }

    tipo.querySelectorAll('button').forEach(boton => boton.addEventListener('click', elegirTipo));
    pegado.addEventListener('input', leerPegado);
    descargar.addEventListener('click', descargarAcuse);
    document.getElementById('limpiarAcuse').addEventListener('click', limpiarAcuse);
    leerPegado();

    const foliosQr = document.getElementById('foliosQr');
    const formatos = document.getElementById('formatos');
    const botonQr = document.getElementById('descargarQr');
    const avisoQr = document.getElementById('avisoQr');
    const PDF_POR_FILA = 10;
    const PDF_POR_HOJA = 130;
    const EXCEL_POR_FILA = 9;
    const EXCEL_PIXELES = 2 / 2.54 * 96;

    function leerFolios() {
      let folios;
      try { folios = JSON.parse(foliosQr.value); } catch {}
      if (!Array.isArray(folios)) folios = foliosQr.value.split('\n');
      return folios.map(folio => String(folio).trim()).filter(Boolean);
    }

    function contarFolios() {
      const cantidad = leerFolios().length;
      avisoQr.textContent = '';
      const formato = formatos.querySelector(':checked').value;
      botonQr.disabled = cantidad === 0;
      botonQr.querySelector('span').textContent = cantidad ? `Descargar ${formato} (${cantidad} QR)` : `Descargar ${formato}`;
    }

    function crearCodigos() {
      qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

      try {
        return leerFolios().map(folio => {
          const codigo = qrcode(0, 'M');
          codigo.addData(folio);
          codigo.make();
          return { folio, codigo };
        });
      } catch {
        avisoQr.textContent = 'Hay un folio demasiado largo para un QR';
        return [];
      }
    }

    function dibujarTarjetaPdf(pdf, folio, codigo, x, y) {
      const color = document.getElementById('colorQr').value;
      const fondo = [1, 3, 5].map(i => Math.round(255 - (255 - parseInt(color.slice(i, i + 2), 16)) * 0.13));
      const modulos = codigo.getModuleCount();
      const lado = 1.3 / modulos;
      const traslape = 0.003;

      pdf.setDrawColor(color);
      pdf.setLineWidth(0.025);
      pdf.setFillColor(...fondo);
      pdf.roundedRect(x + 0.0125, y + 0.0125, 1.975, 1.975, 0.17, 0.17, 'FD');
      pdf.setFillColor('#FFFFFF');
      pdf.roundedRect(x + 0.27, y + 0.09, 1.46, 1.46, 0.1, 0.1, 'F');

      pdf.setFillColor(color);
      for (let fila = 0; fila < modulos; fila++) {
        for (let columna = 0; columna < modulos; columna++) {
          if (codigo.isDark(fila, columna)) pdf.rect(x + 0.35 + columna * lado, y + 0.17 + fila * lado, lado + traslape, lado + traslape, 'F');
        }
      }

      pdf.setFont('helvetica', 'bold');
      pdf.setTextColor(color);
      pdf.setFontSize(8);
      pdf.setFontSize(Math.min(8, 8 * 1.8 / pdf.getTextWidth(folio)));
      pdf.text(folio, x + 1, y + 1.775, { align: 'center', baseline: 'middle' });
    }

    function dibujarTarjetaPng(folio, codigo) {
      const color = document.getElementById('colorQr').value;
      const modulos = codigo.getModuleCount();
      const lado = Math.floor(312 / modulos);
      const orilla = Math.round((352 - lado * modulos) / 2);
      const lienzo = Object.assign(document.createElement('canvas'), { width: 480, height: 480 });
      const pincel = lienzo.getContext('2d');

      pincel.roundRect(3, 3, 474, 474, 40);
      pincel.fillStyle = '#FFFFFF';
      pincel.fill();
      pincel.fillStyle = `${color}22`;
      pincel.fill();
      pincel.strokeStyle = color;
      pincel.lineWidth = 6;
      pincel.stroke();

      pincel.beginPath();
      pincel.roundRect(64, 22, 352, 352, 24);
      pincel.fillStyle = '#FFFFFF';
      pincel.fill();

      pincel.fillStyle = color;
      for (let fila = 0; fila < modulos; fila++) {
        for (let columna = 0; columna < modulos; columna++) {
          if (codigo.isDark(fila, columna)) pincel.fillRect(64 + orilla + columna * lado, 22 + orilla + fila * lado, lado, lado);
        }
      }

      pincel.font = '800 68px system-ui, sans-serif';
      pincel.textAlign = 'center';
      pincel.textBaseline = 'middle';
      pincel.fillText(folio, 240, 426, 436);
      return lienzo.toDataURL();
    }

    function descargarQrPdf() {
      const codigos = crearCodigos();
      if (codigos.length === 0) return;

      const pdf = new jspdf.jsPDF({ unit: 'cm', format: 'letter', compress: true });
      codigos.forEach(({ folio, codigo }, i) => {
        const lugar = i % PDF_POR_HOJA;
        if (i > 0 && lugar === 0) pdf.addPage();
        dibujarTarjetaPdf(pdf, folio, codigo, 0.57 + (lugar % PDF_POR_FILA) * 2.05, 0.67 + Math.floor(lugar / PDF_POR_FILA) * 2.05);
      });
      pdf.save('QR.pdf');
    }

    async function descargarQrExcel() {
      const codigos = crearCodigos();
      if (codigos.length === 0) return;

      const libro = new ExcelJS.Workbook();
      const hoja = libro.addWorksheet('QR', { pageSetup: {
        horizontalCentered: true,
        margins: { left: 0.25, right: 0.25, top: 0.25, bottom: 0.25, header: 0, footer: 0 },
      } });
      hoja.columns = Array(EXCEL_POR_FILA).fill({ width: 11.6 });

      codigos.forEach(({ folio, codigo }, i) => {
        const fila = Math.floor(i / EXCEL_POR_FILA);
        const columna = i % EXCEL_POR_FILA;
        hoja.getRow(fila + 1).height = 58;
        Object.assign(hoja.getCell(fila + 1, columna + 1), { value: folio, font: { color: { argb: 'FFFFFFFF' } } });
        hoja.addImage(libro.addImage({ base64: dibujarTarjetaPng(folio, codigo), extension: 'png' }), { tl: { col: columna, row: fila }, ext: { width: EXCEL_PIXELES, height: EXCEL_PIXELES } });
      });
      await descargarLibro(libro, 'QR');
    }

    function limpiarQr() {
      foliosQr.value = '';
      foliosQr.focus();
      contarFolios();
    }

    foliosQr.addEventListener('input', contarFolios);
    formatos.addEventListener('change', contarFolios);
    botonQr.addEventListener('click', () => formatos.querySelector(':checked').value === 'PDF' ? descargarQrPdf() : descargarQrExcel());

    const OPENCV = 'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js';
    const TESSERACT = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    const HEIC2ANY = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
    const ISNET = 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm'; // el mismo modelo que rembg "isnet-general-use", en el navegador
    const OPCIONES_ISNET = { model: 'isnet_quint8', proxyToWorker: true, output: { format: 'image/png' } };
    const ANCHO = 1284; // 85.6 × 54 mm, proporción de la INE
    const ALTO = 810;
    const MAX_PIXELES = 16e6; // límite de canvas en iPhone
    const MRZ = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<';
    let herramientas = null;
    let lector = null;
    let segmentar = null;

    function cargarScript(src) {
      return new Promise((listo, falla) => document.head.append(Object.assign(document.createElement('script'), { src, onload: listo, onerror: falla })));
    }

    function prepararIne() {
      herramientas ??= Promise.all([
        import(ISNET).then(async ({ preload, segmentForeground }) => {
          await preload(OPCIONES_ISNET);
          segmentar = segmentForeground;
        }),
        cargarScript(OPENCV).then(async () => {
          if (window.cv instanceof Promise) window.cv = await window.cv;
          if (!cv.Mat) await new Promise(listo => cv.onRuntimeInitialized = listo);
        }),
        cargarScript(TESSERACT).then(async () => lector = await Tesseract.createWorker('spa')),
      ]).catch(() => {
        herramientas = null;
        throw new Error('No se pudieron descargar las herramientas de recorte y lectura. Revisa tu conexión a internet.');
      });
      return herramientas;
    }

    function nuevoLienzo(ancho, alto) {
      return Object.assign(document.createElement('canvas'), { width: Math.round(ancho), height: Math.round(alto) });
    }

    function recortar(fuente, ancho, alto, x = 0, y = 0, w = fuente.width, h = fuente.height) {
      const lienzo = nuevoLienzo(ancho, alto);
      lienzo.getContext('2d').drawImage(fuente, x, y, w, h, 0, 0, lienzo.width, lienzo.height);
      return lienzo;
    }

    function escalar(fuente, lado) {
      const escala = Math.min(1, lado / Math.max(fuente.width, fuente.height));
      return recortar(fuente, fuente.width * escala, fuente.height * escala);
    }

    function girar(fuente) {
      const lienzo = nuevoLienzo(fuente.width, fuente.height);
      const pincel = lienzo.getContext('2d');
      pincel.rotate(Math.PI);
      pincel.drawImage(fuente, -fuente.width, -fuente.height);
      return lienzo;
    }

    async function abrirImagen(archivo) {
      let mapa;
      try {
        mapa = await createImageBitmap(archivo);
      } catch {
        try {
          await cargarScript(HEIC2ANY);
          mapa = await createImageBitmap(await heic2any({ blob: archivo, toType: 'image/jpeg', quality: .95 }));
        } catch {
          throw new Error('Solo se aceptan imágenes JPG, PNG o HEIC');
        }
      }
      const escala = Math.min(1, Math.sqrt(MAX_PIXELES / (mapa.width * mapa.height)));
      return recortar(mapa, mapa.width * escala, mapa.height * escala);
    }

    // Esquinas de la tarjeta en fracciones del ancho y alto de la imagen.
    // Se detecta sobre la foto reducida a 1000 px; el recorte final se hace sobre la original.
    async function detectar(imagen) {
      const proporcion = Math.max(imagen.width, imagen.height) / Math.min(imagen.width, imagen.height);
      if (proporcion > 1.53 && proporcion < 1.64) return [[0, 0], [1, 0], [1, 1], [0, 1]]; // ya es un escaneo o recorte de la tarjeta
      const chica = escalar(imagen, 1000);
      const { width: w, height: h } = chica;
      const blob = await new Promise(listo => chica.toBlob(listo, 'image/jpeg', .92));
      const silueta = recortar(await createImageBitmap(await segmentar(blob, OPCIONES_ISNET)), w, h);
      const basura = [];
      const mat = valor => (basura.push(valor), valor);
      const mascara = mat(cv.imread(silueta));
      const contornos = mat(new cv.MatVector());
      cv.cvtColor(mascara, mascara, cv.COLOR_RGBA2GRAY);
      cv.threshold(mascara, mascara, 127, 255, cv.THRESH_BINARY);
      cv.morphologyEx(mascara, mascara, cv.MORPH_OPEN, mat(cv.Mat.ones(7, 7, cv.CV_8U)));
      cv.findContours(mascara, contornos, mat(new cv.Mat()), cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

      let contorno = null;
      for (let i = 0; i < contornos.size(); i++) {
        const opcion = mat(contornos.get(i));
        if (!contorno || cv.contourArea(opcion) > cv.contourArea(contorno)) contorno = opcion;
      }
      const area = contorno ? cv.contourArea(contorno) / (w * h) : 0;
      let puntos = null;

      if (area > .1 && area < .9) {
        const casco = mat(new cv.Mat());
        const aproximado = mat(new cv.Mat());
        cv.convexHull(contorno, casco, false, true);
        const perimetro = cv.arcLength(casco, true);
        for (let epsilon = .01; epsilon <= .08 && !puntos; epsilon += .01) {
          cv.approxPolyDP(casco, aproximado, epsilon * perimetro, true);
          if (aproximado.rows === 4) puntos = [0, 1, 2, 3].map(i => [aproximado.data32S[i * 2], aproximado.data32S[i * 2 + 1]]);
        }
        puntos ??= cv.RotatedRect.points(cv.minAreaRect(casco)).map(({ x, y }) => [x, y]);
      }
      basura.forEach(valor => valor.delete());
      // Sin un contorno claro, o un escaneo donde la tarjeta ocupa casi toda la imagen: se usa completa
      return puntos ? puntos.map(([x, y]) => [x / w, y / h]) : [[0, 0], [1, 0], [1, 1], [0, 1]];
    }

    // Sup-izq, sup-der, inf-der, inf-izq
    function ordenar(puntos) {
      const [cx, cy] = [0, 1].map(eje => puntos.reduce((suma, punto) => suma + punto[eje], 0) / 4);
      const angulo = ([x, y]) => Math.atan2(y - cy, x - cx);
      const ordenados = [...puntos].sort((a, b) => angulo(a) - angulo(b));
      const sumas = ordenados.map(([x, y]) => x + y);
      const inicio = sumas.indexOf(Math.min(...sumas));
      return [...ordenados.slice(inicio), ...ordenados.slice(0, inicio)];
    }

    function enderezar(imagen, esquinas) {
      let puntos = ordenar(esquinas.map(([x, y]) => [x * imagen.width, y * imagen.height]));
      const lado = (a, b) => Math.hypot(puntos[a][0] - puntos[b][0], puntos[a][1] - puntos[b][1]);
      if (lado(1, 2) + lado(3, 0) > lado(0, 1) + lado(2, 3)) puntos = [...puntos.slice(1), puntos[0]]; // vertical: queda horizontal

      const foto = cv.imread(imagen);
      const resultado = new cv.Mat();
      const desde = cv.matFromArray(4, 1, cv.CV_32FC2, puntos.flat());
      const hacia = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, ANCHO, 0, ANCHO, ALTO, 0, ALTO]);
      const matriz = cv.getPerspectiveTransform(desde, hacia);
      cv.warpPerspective(foto, resultado, matriz, new cv.Size(ANCHO, ALTO), cv.INTER_LINEAR);
      const tarjeta = nuevoLienzo(ANCHO, ALTO);
      cv.imshow(tarjeta, resultado);
      [foto, resultado, desde, hacia, matriz].forEach(valor => valor.delete());
      return tarjeta;
    }

    async function ocr(lienzo, permitidos = '') {
      await lector.setParameters({ tessedit_pageseg_mode: '6', tessedit_char_whitelist: permitidos });
      return (await lector.recognize(lienzo)).data;
    }

    // Líneas tipo pasaporte (MRZ) de la parte baja del reverso; vacío si no las hay
    async function leerMrz(tarjeta) {
      const { text } = await ocr(recortar(tarjeta, ANCHO, ALTO * .4, 0, ALTO * .6, ANCHO, ALTO * .4), MRZ);
      const lineas = text.split('\n').map(linea => linea.replaceAll(' ', '')).filter(linea => linea.includes('<'));
      return lineas.join('').split('<').length > 10 ? lineas : [];
    }

    // Bloque NOMBRE del frente, a la derecha de la foto
    function zonaNombre(tarjeta) {
      return recortar(tarjeta, ANCHO * .52, ALTO * .4, ANCHO * .28, ALTO * .2, ANCHO * .52, ALTO * .4);
    }

    // Pone la tarjeta al derecho. El reverso se reconoce por la MRZ; el frente, por qué lado se lee mejor.
    async function orientar(tarjeta) {
      const girada = girar(tarjeta);
      for (const opcion of [tarjeta, girada]) {
        const mrz = await leerMrz(opcion);
        if (mrz.length) return { tarjeta: opcion, mrz, texto: '' };
      }
      const derecho = await ocr(zonaNombre(tarjeta));
      const deCabeza = await ocr(zonaNombre(girada));
      return derecho.confidence >= deCabeza.confidence
        ? { tarjeta, mrz: [], texto: derecho.text }
        : { tarjeta: girada, mrz: [], texto: deCabeza.text };
    }

    function normalizar(texto) {
      return texto.toUpperCase().replace(/[ÁÉÍÓÚÜ]/g, letra => 'AEIOUU'['ÁÉÍÓÚÜ'.indexOf(letra)]);
    }

    function limpiar(texto) {
      return normalizar(texto).replace(/SEXO.*/g, '').replace(/[^A-ZÑ]/g, ' ').split(' ').filter(palabra => palabra.length > 1).join(' ');
    }

    // APELLIDO1<APELLIDO2<<NOMBRE1<NOMBRE2 → APELLIDO1 APELLIDO2 NOMBRE1 NOMBRE2
    function nombreMrz(mrz) {
      for (const linea of [...mrz].reverse()) {
        const partes = linea.match(/^([A-Z]+(?:<[A-Z]+)*)<<([A-Z]+(?:<[A-Z]+)*)/);
        if (partes) return `${partes[1]} ${partes[2]}`.replaceAll('<', ' ');
      }
      return '';
    }

    // Las 3 líneas bajo NOMBRE: apellido paterno, materno y nombres
    function nombreFrente(texto) {
      const lineas = texto.split('\n').map(limpiar);
      const inicio = lineas.findIndex(linea => linea.includes('NOMBRE'));
      if (inicio < 0) return '';
      const nombre = [];
      for (const linea of lineas.slice(inicio + 1)) {
        if (linea.includes('DOMICILIO') || nombre.length === 3) break;
        if (linea) nombre.push(linea);
      }
      return nombre.join(' ');
    }

    // La MRZ escribe la Ñ como N; se recupera de las palabras con Ñ del frente
    function conEnie(nombre, textoFrente) {
      const enies = Object.fromEntries(limpiar(textoFrente).split(' ').filter(palabra => palabra.includes('Ñ')).map(palabra => [palabra.replaceAll('Ñ', 'N'), palabra]));
      return nombre.split(' ').filter(Boolean).map(palabra => enies[palabra] ?? palabra).join(' ');
    }

    const INE_MAX_BYTES = 15 * 1024 * 1024;
    const archivosIne = { frente: document.getElementById('ineFrente'), reverso: document.getElementById('ineReverso') };
    const nombreIne = document.getElementById('nombreIne');
    const avisoIne = document.getElementById('avisoIne');
    const generarPdf = document.getElementById('generarPdf');
    const tipoAnexo = document.getElementById('tipoAnexo');
    const cargaAnexo = document.getElementById('cargaAnexo');
    const anexoIne = document.getElementById('anexoIne');
    const editor = document.getElementById('editor');
    const lienzo = editor.querySelector('.lienzo');
    let ladosIne = { frente: {}, reverso: {} };
    let colaIne = Promise.resolve();
    let nombreEditado = false;
    let editando = '';
    let esquinasEditor = [];
    let arrastre = null;

    function descargarArchivo(datos, nombre) {
      const enlace = document.createElement('a');
      enlace.href = URL.createObjectURL(datos);
      enlace.download = nombre;
      enlace.click();
    }

    async function juntarPdfs(archivos) {
      const unido = await PDFLib.PDFDocument.create();
      for (const archivo of archivos) {
        let documento;
        try {
          documento = await PDFLib.PDFDocument.load(await archivo.arrayBuffer(), { ignoreEncryption: true });
        } catch {
          throw new Error(`${archivo.name} no es un PDF válido`);
        }
        (await unido.copyPages(documento, documento.getPageIndices())).forEach(pagina => unido.addPage(pagina));
      }
      return new Blob([await unido.save()], { type: 'application/pdf' });
    }

    function avisarIne(texto, error = false) {
      avisoIne.textContent = texto;
      avisoIne.className = error ? 'error' : '';
    }

    function anexoElegido() {
      return tipoAnexo.querySelector('[aria-pressed="true"]').dataset.anexo;
    }

    function actualizarAnexo() {
      const anexo = anexoElegido();
      const archivo = anexoIne.files[0];
      cargaAnexo.hidden = !anexo;
      cargaAnexo.querySelector('.archivo').classList.toggle('listo', Boolean(archivo));
      cargaAnexo.querySelector('.archivo span').textContent = archivo?.name ?? `Toca para subir el PDF de ${anexo}`;
      generarPdf.disabled = !(ladosIne.frente.tarjeta && ladosIne.reverso.tarjeta) || (anexo && !archivo);
    }

    function elegirAnexo(event) {
      tipoAnexo.querySelectorAll('button').forEach(boton => boton.setAttribute('aria-pressed', boton === event.currentTarget));
      actualizarAnexo();
    }

    function mostrarLado(lado, estado) {
      const caja = document.querySelector(`[data-lado="${lado}"]`);
      const recorte = caja.querySelector('.recorte');
      recorte.hidden = !estado?.tarjeta;
      caja.querySelector('.ajustar').hidden = !estado?.tarjeta;
      if (estado?.tarjeta) recorte.src = estado.tarjeta.toDataURL('image/jpeg', .9);
      else recorte.removeAttribute('src');
    }

    function marcarCargando(lado, activo) {
      document.querySelector(`[data-lado="${lado}"]`).classList.toggle('cargando', activo);
    }

    // De uno en uno: hay un solo lector de Tesseract y sus parámetros cambian entre lecturas
    function procesarLado(lado, estado) {
      marcarCargando(lado, true);
      colaIne = colaIne.then(async () => {
        if (ladosIne[lado] !== estado) return;
        let error = '';
        try {
          await prepararIne();
          estado.imagen ??= await abrirImagen(estado.archivo);
          estado.esquinas ??= await detectar(estado.imagen);
          Object.assign(estado, await orientar(enderezar(estado.imagen, estado.esquinas)));
        } catch (falla) {
          error = falla.message;
        }
        if (ladosIne[lado] !== estado) return;
        if (error) {
          ladosIne[lado] = {};
          archivosIne[lado].value = '';
          avisarIne(error, true);
        }
        marcarCargando(lado, false);
        mostrarLado(lado, ladosIne[lado]);
        revisarIne();
      });
    }

    function revisarIne() {
      const { frente, reverso } = ladosIne;
      if (frente.mrz?.length && reverso.tarjeta && !reverso.mrz.length) {
        ladosIne = { frente: reverso, reverso: frente };
        [archivosIne.frente.files, archivosIne.reverso.files] = [archivosIne.reverso.files, archivosIne.frente.files];
        Object.keys(ladosIne).forEach(lado => mostrarLado(lado, ladosIne[lado]));
        avisarIne('Venían al revés: intercambié frente y reverso');
      }
      const lados = Object.values(ladosIne);
      const mrz = lados.find(lado => lado.mrz?.length)?.mrz ?? [];
      const texto = lados.find(lado => lado.texto)?.texto ?? '';
      if (!nombreEditado) nombreIne.value = conEnie(nombreMrz(mrz), texto) || nombreFrente(texto);
      actualizarAnexo();
    }

    function cambiarImagen(event) {
      const lado = event.target.closest('.lado').dataset.lado;
      const archivo = event.target.files[0];
      const estado = ladosIne[lado] = archivo?.size <= INE_MAX_BYTES ? { archivo } : {};
      mostrarLado(lado, null);
      avisarIne(archivo?.size > INE_MAX_BYTES ? 'La imagen pesa más de 15 MB' : '', true);
      if (estado.archivo) procesarLado(lado, estado);
      else event.target.value = '';
      revisarIne();
    }

    async function descargarPdfIne() {
      const nombre = `${nombreIne.value.toUpperCase().replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, ' ').trim() || 'INE'}.pdf`;
      const pdf = new jspdf.jsPDF({ unit: 'in', format: 'letter' }); // carta a 200 dpi: frente en (208, 200) px y reverso en (208, 1150) px
      pdf.addImage(ladosIne.frente.tarjeta, 'JPEG', 208 / 200, 200 / 200, ANCHO / 200, ALTO / 200);
      pdf.addImage(ladosIne.reverso.tarjeta, 'JPEG', 208 / 200, 1150 / 200, ANCHO / 200, ALTO / 200);
      const ine = pdf.output('blob');
      if (!anexoElegido()) return descargarArchivo(ine, nombre);
      try {
        descargarArchivo(await juntarPdfs([ine, anexoIne.files[0]]), nombre);
        avisarIne('');
      } catch (error) {
        avisarIne(error.message, true);
      }
    }

    function limpiarIne() {
      Object.values(archivosIne).forEach(input => input.value = '');
      ladosIne = { frente: {}, reverso: {} };
      Object.keys(ladosIne).forEach(lado => {
        mostrarLado(lado, null);
        marcarCargando(lado, false);
      });
      nombreIne.value = '';
      nombreEditado = false;
      anexoIne.value = '';
      tipoAnexo.querySelector('button').click();
      avisarIne('');
    }

    function dibujarEsquinas() {
      lienzo.querySelectorAll('.esquina').forEach((marca, i) => {
        marca.style.left = `${esquinasEditor[i][0] * 100}%`;
        marca.style.top = `${esquinasEditor[i][1] * 100}%`;
      });
      lienzo.querySelector('polygon').setAttribute('points', esquinasEditor.join(' '));
    }

    async function abrirEditor(event) {
      editando = event.target.closest('.lado').dataset.lado;
      esquinasEditor = ladosIne[editando].esquinas.map(punto => [...punto]);
      const imagen = lienzo.querySelector('img');
      imagen.src = escalar(ladosIne[editando].imagen, 1000).toDataURL('image/jpeg', .9);
      await imagen.decode();
      lienzo.style.setProperty('--proporcion', imagen.naturalWidth / imagen.naturalHeight);
      dibujarEsquinas();
      editor.showModal();
    }

    function moverEsquina(event) {
      if (!event.buttons) return;
      const caja = lienzo.getBoundingClientRect();
      const punto = [(event.clientX - caja.left) / caja.width, (event.clientY - caja.top) / caja.height];
      if (event.type === 'pointerdown') {
        lienzo.setPointerCapture(event.pointerId);
        const distancias = esquinasEditor.map(([x, y]) => Math.hypot((x - punto[0]) * caja.width, (y - punto[1]) * caja.height));
        const i = distancias.indexOf(Math.min(...distancias));
        arrastre = { i, desfase: [esquinasEditor[i][0] - punto[0], esquinasEditor[i][1] - punto[1]] };
      }
      esquinasEditor[arrastre.i] = punto.map((valor, eje) => Math.min(1, Math.max(0, valor + arrastre.desfase[eje])));
      dibujarEsquinas();
    }

    function aplicarEsquinas() {
      const { archivo, imagen } = ladosIne[editando];
      const estado = ladosIne[editando] = { archivo, imagen, esquinas: esquinasEditor };
      editor.close();
      procesarLado(editando, estado);
      revisarIne();
    }

    document.querySelector('[data-modo="ine"]').addEventListener('click', () => prepararIne().catch(() => {}));
    Object.values(archivosIne).forEach(input => input.addEventListener('change', cambiarImagen));
    document.querySelectorAll('.ajustar').forEach(boton => boton.addEventListener('click', abrirEditor));
    nombreIne.addEventListener('input', () => nombreEditado = nombreIne.value !== '');
    generarPdf.addEventListener('click', descargarPdfIne);
    document.getElementById('limpiarIne').addEventListener('click', limpiarIne);
    lienzo.addEventListener('pointerdown', moverEsquina);
    lienzo.addEventListener('pointermove', moverEsquina);
    document.getElementById('aplicarEsquinas').addEventListener('click', aplicarEsquinas);
    document.getElementById('cancelarEsquinas').addEventListener('click', () => editor.close());
    tipoAnexo.querySelectorAll('button').forEach(boton => boton.addEventListener('click', elegirAnexo));
    anexoIne.addEventListener('change', actualizarAnexo);

    const pdfsUnir = document.getElementById('pdfsUnir');
    const listaUnir = document.getElementById('listaUnir');
    const avisoUnir = document.getElementById('avisoUnir');
    const unirPdf = document.getElementById('unirPdf');
    let archivosUnir = [];

    function avisarUnir(texto, error = false) {
      avisoUnir.textContent = texto;
      avisoUnir.className = error ? 'error' : '';
    }

    function mostrarPdfs() {
      listaUnir.replaceChildren(...archivosUnir.map(archivo => {
        const fila = document.getElementById('plantillaPdf').content.firstElementChild.cloneNode(true);
        fila.querySelector('span').textContent = archivo.name;
        return fila;
      }));
      unirPdf.disabled = archivosUnir.length < 2;
    }

    function agregarPdfs() {
      archivosUnir.push(...pdfsUnir.files);
      pdfsUnir.value = '';
      avisarUnir('');
      mostrarPdfs();
    }

    function ordenarPdfs(event) {
      const boton = event.target.closest('button');
      if (!boton) return;
      const i = [...listaUnir.children].indexOf(boton.closest('li'));
      const [archivo] = archivosUnir.splice(i, 1);
      if (boton.classList.contains('subir')) archivosUnir.splice(i - 1, 0, archivo);
      mostrarPdfs();
    }

    async function unirPdfs() {
      unirPdf.disabled = true;
      avisarUnir('Uniendo…');
      try {
        descargarArchivo(await juntarPdfs(archivosUnir), 'PDF unido.pdf');
        avisarUnir('');
      } catch (error) {
        avisarUnir(error.message, true);
      }
      unirPdf.disabled = archivosUnir.length < 2;
    }

    function limpiarUnir() {
      archivosUnir = [];
      avisarUnir('');
      mostrarPdfs();
    }

    pdfsUnir.addEventListener('change', agregarPdfs);
    listaUnir.addEventListener('click', ordenarPdfs);
    unirPdf.addEventListener('click', unirPdfs);
    document.getElementById('limpiarUnir').addEventListener('click', limpiarUnir);
  </script>
</body>
</html>
